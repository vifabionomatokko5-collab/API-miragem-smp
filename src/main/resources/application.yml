spring:
  application:
    name: miragem-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/miragem;MODE=PostgreSQL;AUTO_SERVER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: false

server:
  port: ${PORT:8080}

miragem:
  api:
    token: ${MIRAGEM_API_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

info:
  app:
    name: Miragem API
    version: 1.0.0
